# FREE-tier DEMO blueprint (no disk, 512 MB): comes up with ready-made sample data; everything resets on every restart / idle spin-down.
# Not for real records. Logins: Administrator / Garage@Demo2026, manager.demo@example.com, reception.demo@example.com
# (all with password Garage@Demo2026).
services:
  - type: web
    name: garage-erp
    runtime: docker
    plan: free
    dockerfilePath: ./render/Dockerfile
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: LITE
        value: "1"
      - key: DEMO_SEED
        value: "1"
      - key: SITE_NAME
        value: garage.local
      - key: ADMIN_PASSWORD
        value: Garage@Demo2026
