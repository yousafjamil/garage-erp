; LITE profile for 512 MB instances: 1 web worker, no background worker/scheduler/realtime/backup
[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --datadir=%(ENV_DATA_DIR)s/mysql --bind-address=127.0.0.1 --port=3306 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake --innodb-buffer-pool-size=32M --innodb-log-file-size=8M --innodb-log-buffer-size=2M --key-buffer-size=2M --aria-pagecache-buffer-size=8M --max-connections=12 --thread-stack=256K --read-buffer-size=128K --sort-buffer-size=256K --join-buffer-size=256K --table-open-cache=200 --thread-cache-size=2 --tmp-table-size=16M --max-heap-table-size=16M --performance-schema=OFF
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis-cache]
command=/usr/bin/redis-server --port 6379 --bind 127.0.0.1 --save "" --maxmemory 24mb --maxmemory-policy allkeys-lru
user=frappe
priority=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis-queue]
command=/usr/bin/redis-server --port 6380 --bind 127.0.0.1 --appendonly yes --dir %(ENV_DATA_DIR)s/redis --maxmemory 24mb
user=frappe
priority=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:bootstrap]
command=/usr/local/bin/bootstrap-site.sh
user=frappe
directory=/home/frappe/frappe-bench
priority=10
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/frappe"

[program:gunicorn]
command=/bin/bash -c "until [ -f %(ENV_DATA_DIR)s/.ready ]; do sleep 3; done; exec /home/frappe/frappe-bench/env/bin/gunicorn --chdir=/home/frappe/frappe-bench/sites --bind=127.0.0.1:8000 --workers=1 --threads=4 --worker-class=gthread --worker-tmp-dir=/dev/shm --timeout=120 frappe.app:application"
user=frappe
directory=/home/frappe/frappe-bench
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/frappe",GUNICORN_WORKERS="1",GUNICORN_THREADS="4"




[program:nginx]
command=/usr/local/bin/start-nginx.sh
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

