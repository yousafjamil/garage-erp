[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --datadir=%(ENV_DATA_DIR)s/mysql --bind-address=127.0.0.1 --port=3306 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake --innodb-buffer-pool-size=256M --max-connections=60 --performance-schema=OFF
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis-cache]
command=/usr/bin/redis-server --port 6379 --bind 127.0.0.1 --save "" --maxmemory 96mb --maxmemory-policy allkeys-lru
user=frappe
priority=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis-queue]
command=/usr/bin/redis-server --port 6380 --bind 127.0.0.1 --appendonly yes --dir %(ENV_DATA_DIR)s/redis --maxmemory 96mb
user=frappe
priority=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:bootstrap]
command=/usr/local/bin/bootstrap-site.sh
user=frappe
directory=/home/frappe/frappe-bench
priority=10
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/frappe"

[program:gunicorn]
command=/bin/bash -c "until [ -f %(ENV_DATA_DIR)s/.ready ]; do sleep 3; done; exec /usr/local/bin/start.sh"
user=frappe
directory=/home/frappe/frappe-bench
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/frappe",GUNICORN_WORKERS="2",GUNICORN_THREADS="4"

[program:worker]
command=/bin/bash -c "until [ -f %(ENV_DATA_DIR)s/.ready ]; do sleep 3; done; exec bench worker --queue short,default,long"
user=frappe
directory=/home/frappe/frappe-bench
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/frappe"

[program:scheduler]
command=/bin/bash -c "until [ -f %(ENV_DATA_DIR)s/.ready ]; do sleep 3; done; exec bench schedule"
user=frappe
directory=/home/frappe/frappe-bench
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/frappe"

[program:socketio]
command=/bin/bash -c "until [ -f %(ENV_DATA_DIR)s/.ready ]; do sleep 3; done; exec node /home/frappe/frappe-bench/apps/frappe/socketio.js"
user=frappe
directory=/home/frappe/frappe-bench
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/frappe"

[program:nginx]
command=/usr/local/bin/start-nginx.sh
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backup]
; one full backup (database + files) a day, kept 7 days on the disk (System > Backups in the app, or Render's disk snapshots, can copy them off)
command=/bin/bash -c "until [ -f %(ENV_DATA_DIR)s/.ready ]; do sleep 5; done; while true; do sleep 86400; bench --site ${SITE_NAME:-garage.local} backup --with-files; find %(ENV_DATA_DIR)s/sites/${SITE_NAME:-garage.local}/private/backups -type f -mtime +7 -delete; done"
user=frappe
directory=/home/frappe/frappe-bench
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/frappe"
